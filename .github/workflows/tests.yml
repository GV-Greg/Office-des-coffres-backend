name: Tests

# Déclencheurs volontairement sans `push` : sur main, les tests sont appelés par
# deploy.yml via workflow_call, qui bloque le déploiement s'ils échouent. Les garder
# aussi sur `push` les ferait tourner deux fois pour rien à chaque mise en prod.
on:
  pull_request:
  workflow_call:

jobs:
  backend-tests:
    name: Backend (Pest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet nécessaire à scripts/docs-sync-check.sh (git log sur
          # app/routes/database/config pour la fraîcheur d'ARCHITECTURE.md) — un
          # checkout superficiel (défaut) ne verrait que le commit de tête.
          fetch-depth: 0

      - name: Vérifier la synchronisation de la documentation (Docs #10)
        run: ./scripts/docs-sync-check.sh

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, fileinfo, mysql, sqlite3, bcmath, intl, pcntl, zip, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Copy .env
        run: cp .env.example .env

      # Placé avant `composer install` : contrairement à `npm ci`, `composer install` ne
      # vide pas le cache de téléchargement de Composer — restaurer avant l'installation
      # évite de retélécharger les paquets, sans changer le comportement de la commande.
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Build Vite assets (admin Blade views)
        run: npm ci && npm run build

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests
        run: php artisan test

  # Le moteur de la prod (brief admin/content/brief-mariadb-dev.md, §6). La suite Pest tourne sur
  # SQLite, qui accepte ce que MariaDB refuse (cas réel : un second `timestamp` NOT NULL, refusé par
  # MySQL 5.7, trouvé à la main). Ce job ne fait QUE `migrate` sur MariaDB 11.4.13 : deploy.yml
  # appelle ce workflow, donc une migration qui ne passe pas sur le moteur de prod bloque la mise en
  # prod. Version épinglée = celle de la prod (relevée le 04/10/2026) — la suivre si O2Switch change.
  migrations:
    name: Migrations (MariaDB 11.4.13)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4.13
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: office-des-coffres
          MARIADB_USER: odc
          MARIADB_PASSWORD: odc
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -uodc -podc"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # Pilote `mysql` : celui de la prod (DB_CONNECTION relevé le 04/10/2026), pas `mariadb`.
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: office-des-coffres
      DB_USERNAME: odc
      DB_PASSWORD: odc

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, fileinfo, pdo_mysql, bcmath, intl, zip
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      # Même jeu de caractères que la base de prod (utf8mb4_unicode_ci) : le service ne prend pas
      # d'option de démarrage, et le défaut de MariaDB 11.4 est latin1.
      - name: Align database charset on production
        run: mysql -h 127.0.0.1 -uroot -proot -e "ALTER DATABASE \`office-des-coffres\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Run migrations on MariaDB
        run: php artisan migrate --force
