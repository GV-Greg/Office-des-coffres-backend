name: Deploy to O2Switch

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Le déploiement est conditionné aux tests : jusqu'ici les deux workflows se
  # déclenchaient en parallèle sur un push, donc un commit aux tests rouges partait
  # quand même en prod. Réutilise tests.yml plutôt que d'en recopier les étapes,
  # pour qu'il n'existe qu'une seule définition de la suite de tests.
  tests:
    uses: ./.github/workflows/tests.yml

  build-and-deploy:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build Vite assets
        run: npm ci && npm run build

      - name: Deploy files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_BACK_SERVER }}
          username: ${{ secrets.FTP_BACK_USERNAME }}
          password: ${{ secrets.FTP_BACK_PASSWORD }}
          local-dir: ./
          server-dir: /back/
          # Au-delà des dépendances et du stockage : l'outillage et la documentation, sans usage
          # à l'exécution (29/09/2026, admin/content/brief-menage-prod.md). Hors racine web
          # (public/), donc de l'encombrement, pas une divulgation. ⚠️ JAMAIS
          # composer.json/composer.lock : vendor/ est construit SUR le serveur (composer install
          # --no-dev), qui en a besoin — gardé par tests/Unit/Enforcement/DeployExcludeTest.php.
          # Commentaires ici et non dans le bloc : dans `exclude: |`, un « # » serait un motif.
          # Le déploiement ne supprime rien côté serveur : ce qui y est déjà se retire à la main.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/storage/logs/**
            **/storage/framework/**
            **/storage/app/**
            .env
            Dockerfile.dev
            docker-entrypoint.sh
            .docker/**
            tests/**
            docs/**
            scripts/**
            resources/js/**
            resources/sass/**
            README.md
            CHANGELOG.md
            .editorconfig
            .env.example
            .env.testing
            phpunit.xml
            phpstan.neon
            package.json
            package-lock.json
            postcss.config.js
            tailwind.config.js
            vite.config.js

      # Origine canonique (voir public/.htaccess) : les trois autres variantes doivent rediriger
      # vers https://odc-admin.creacube.be en gardant chemin et paramètres — sans quoi la page de
      # connexion admin redevient servable en clair. 301 ou 302 acceptés (302 le temps de
      # vérifier la règle en prod, 301 ensuite). La variante canonique doit répondre 200 sans
      # redirection — une boucle échouerait ici.
      - name: Vérifier la redirection vers l'origine canonique
        run: |
          CANONICAL="https://odc-admin.creacube.be"
          PROBE="/login?verif=1"
          FAILED=0

          STATUS=$(curl -sS -o /dev/null --max-time 15 -w '%{http_code}' "${CANONICAL}${PROBE}")
          echo "${CANONICAL}${PROBE} → ${STATUS}"
          if [ "$STATUS" != "200" ]; then
            echo "::error::L'origine canonique répond ${STATUS} au lieu de 200 (boucle de redirection ?)."
            FAILED=1
          fi

          for VARIANT in https://www.odc-admin.creacube.be http://odc-admin.creacube.be http://www.odc-admin.creacube.be; do
            sleep 2
            RESULT=$(curl -sS -o /dev/null --max-time 15 -w '%{http_code} %{redirect_url}' "${VARIANT}${PROBE}")
            echo "${VARIANT}${PROBE} → ${RESULT}"
            case "$RESULT" in
              "301 ${CANONICAL}${PROBE}"|"302 ${CANONICAL}${PROBE}") ;;
              *)
                echo "::error::${VARIANT} ne redirige pas vers ${CANONICAL}${PROBE}."
                FAILED=1
                ;;
            esac
          done

          if [ "$FAILED" != "0" ]; then exit 1; fi
          echo "✅ Les trois variantes redirigent vers l'origine canonique."

      # CORS : la restriction d'origine vit dans le .env du serveur (CORS_ALLOWED_ORIGINS), que le
      # déploiement ne touche jamais. La prod a répondu « * » des semaines sans que rien ne le
      # signale (admin/content/cors-prod.md) : on vérifie donc le résultat, pas la configuration.
      # L'assertion encode l'invariant, pas l'implémentation : avec UNE origine configurée,
      # php-cors la pose statiquement quel que soit l'appelant ; avec plusieurs, l'en-tête est
      # absent pour un tiers. Les deux sont corrects — seuls « * » et l'écho de l'origine tierce
      # sont des échecs. Espacé et réessayé : O2Switch répond parfois 429 aux rafales.
      - name: Vérifier la restriction CORS de l'API
        run: |
          API="https://odc-admin.creacube.be/api/v1/map"
          OFFICE="https://officedescoffres.creacube.be"
          THIRD="https://example.org"

          allow_origin() {
            for attempt in 1 2 3 4 5; do
              HEADERS=$(curl -sS -o /dev/null -D - --max-time 15 -H "Origin: $1" "$API" || true)
              if echo "$HEADERS" | head -1 | grep -q ' 200'; then
                echo "$HEADERS" | tr -d '\r' | grep -i '^access-control-allow-origin:' | sed 's/^[^:]*: *//'
                return 0
              fi
              echo "Tentative $attempt/5 ($1) : réponse inattendue, nouvel essai dans 5s..." >&2
              echo "$HEADERS" | head -1 >&2
              sleep 5
            done
            echo "::error::$API ne répond pas 200 (origine $1)." >&2
            return 1
          }

          FOR_OFFICE=$(allow_origin "$OFFICE") || exit 1
          echo "Origin: $OFFICE → '${FOR_OFFICE}'"
          if [ "$FOR_OFFICE" != "$OFFICE" ]; then
            echo "::error::Pour l'origine de l'Office, Access-Control-Allow-Origin vaut '${FOR_OFFICE}' au lieu de '${OFFICE}' (CORS_ALLOWED_ORIGINS absente ou fausse dans le .env du serveur, ou config en cache périmée : php artisan config:cache)."
            exit 1
          fi

          sleep 2
          FOR_THIRD=$(allow_origin "$THIRD") || exit 1
          echo "Origin: $THIRD → '${FOR_THIRD}'"
          if [ "$FOR_THIRD" = "*" ] || [ "$FOR_THIRD" = "$THIRD" ]; then
            echo "::error::Une origine tierce reçoit Access-Control-Allow-Origin '${FOR_THIRD}' : l'API est ouverte à n'importe quel site."
            exit 1
          fi

          echo "✅ CORS restreint : l'Office est autorisé, une origine tierce ne l'est pas."

      - name: Notifier le salon admin/mod (succès ou échec)
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          DISCORD_ADMIN_WEBHOOK_URL: ${{ secrets.DISCORD_ADMIN_WEBHOOK_URL }}
        with:
          script: |
            const webhook = process.env.DISCORD_ADMIN_WEBHOOK_URL
            if (!webhook) { core.info('DISCORD_ADMIN_WEBHOOK_URL non configuré — notification ignorée.'); return }
            const status = '${{ job.status }}'
            const commit = context.payload.head_commit
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = {
              content: status === 'success'
                ? `✅ **Office des coffres — backend** déployé avec succès`
                : `❌ **Office des coffres — backend** — échec du déploiement`,
              embeds: [{
                color: status === 'success' ? 0x22C55E : 0xDC2626,
                description: (commit?.message ?? '(déclenchement manuel, pas de commit associé)').slice(0, 500),
                url: commit?.url ?? runUrl,
                fields: [{ name: 'Run', value: runUrl }]
              }]
            }
            try {
              const res = await fetch(webhook, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
              if (!res.ok) core.warning(`Discord a répondu ${res.status}`)
            } catch (err) {
              core.warning(`Notification Discord admin échouée: ${err.message}`)
            }
